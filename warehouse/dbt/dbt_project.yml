name: warehouse_gpt
version: "1.0.0"
config-version: 2
profile: warehouse_gpt

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  warehouse_gpt:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    meta:
      +materialized: table
      +schema: meta

tests:
  warehouse_gpt:
    +store_failures: false
